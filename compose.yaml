services:
  safety-digital:
    build: .
    container_name: safety-digital
    restart: unless-stopped
    ports:
      - "127.0.0.1:3600:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SHE_PUBLIC_URL: "${SHE_PUBLIC_URL:-https://she.sugidigital.org}"
      CMMS_URL: "${CMMS_URL:-}"
      CMMS_USERNAME: "${CMMS_USERNAME:-}"
      CMMS_PASSWORD: "${CMMS_PASSWORD:-}"
    volumes:
      - safety_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  safety_data:
