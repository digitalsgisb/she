services:
  safety-digital:
    build: .
    container_name: safety-digital
    restart: unless-stopped
    ports:
      - "127.0.0.1:3600:8000"
    volumes:
      - safety_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  safety_data:
