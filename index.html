<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e4e3e" />
    <meta name="description" content="Safety Digital — Sugihara's Safety, Health and Environmental workspace." />
    <title>Safety Digital · SHE Workspace</title>
    <link rel="icon" type="image/png" href="/brand/1.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark"><img src="/brand/1.png" alt="Sugihara logo" /></span>
          <span class="brand-copy"><strong>Safety Digital</strong><small>SHE workspace</small></span>
        </div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-bottom">
          <div class="sidebar-note"><span class="note-spark">✳</span><span><strong>Built for a safer tomorrow</strong><small>One workspace for SHE.</small></span></div>
          <div class="sidebar-footer">SUGIHARA · SHE DEPARTMENT</div>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <div class="topbar-left">
            <button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">☰</button>
            <span class="breadcrumb-root">SHE Workspace</span><span class="breadcrumb-chevron">›</span><strong id="breadcrumb">Dashboard</strong>
          </div>
          <div class="topbar-right"><span class="workspace-pill"><span class="status-dot"></span> Workspace preview</span><span class="topbar-divider"></span><span class="header-brand"><img src="/brand/1.png" alt="" /> Sugihara</span></div>
        </header>
        <main id="content" tabindex="-1"></main>
      </div>
    </div>
    <div class="mobile-backdrop" id="backdrop"></div>
    <script src="/script.js"></script>
